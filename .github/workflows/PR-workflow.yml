name: Pull Request workflow

on:
  pull_request:
    types: [opened, edited, synchronize]
    branches: [dev]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        uses: bahmutov/npm-install@v1

      - name: Build project
        run: npm run build

      - name: Run Unit Tests
        run: npm test
        
  security-sast-sca:
    name: SAST & SCA Security Scan
    uses: ./.github/workflows/security-sast-sca.yml
    with:
      scan_type: 'all'
      branch_name: ${{ github.head_ref }}
      
  security-dast:
    name: DAST Security Scan
    uses: ./.github/workflows/security-dast.yml
    needs: build
    with:
      target_url: 'http://localhost:3000'
      scan_intensity: 'medium'
      
  security-gate:
    name: Security Compliance Gate
    uses: ./.github/workflows/security-gates.yml
    needs: [security-sast-sca, security-dast]
    with:
      sast_result: ${{ needs.security-sast-sca.result }}
      sca_result: ${{ needs.security-sast-sca.result }}
      dast_result: ${{ needs.security-dast.result }}
      
  final-check:
    name: Final PR Check
    runs-on: ubuntu-latest
    needs: [build, security-gate]
    
    steps:
      - name: PR Ready for Review
        run: |
          echo "✅ All checks passed!"
          echo "✅ Build: ${{ needs.build.result }}"
          echo "✅ Security: ${{ needs.security-gate.result }}"
          echo "📝 PR is ready for review and merge"