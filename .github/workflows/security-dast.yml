name: DAST Security Scan

on:
  pull_request:
    branches: [dev]
  workflow_call:
    inputs:
      target_url:
        description: 'URL to scan'
        required: false
        type: string
      scan_intensity:
        description: 'Scan intensity level'
        required: false
        default: 'medium'
        type: string
  workflow_dispatch:


jobs:
  deploy-and-scan:
    name: Deploy to Ephemeral Environment & DAST Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Deploy to ephemeral environment
        run: |
          # This would deploy to a temporary environment (Heroku, Docker, etc.)
          echo "Deploying to ephemeral environment for DAST scanning..."
          # Example: docker-compose up -d
          # Example: heroku create --app temporary-scan-app-${GITHUB_SHA}
          
      - name: Wait for application to be ready
        run: |
          echo "Waiting for application to start..."
          sleep 60
          
      - name: OWASP ZAP DAST Scan
        uses: zaproxy/action-full-scan@v0.9.0
        with:
          target: 'http://your-ephemeral-app-url.com'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'
          
      - name: Fail on critical DAST findings
        if: failure()
        run: |
          echo "❌ CRITICAL: DAST scan found security vulnerabilities"
          echo "Blocking deployment due to security issues"
          exit 1
          
      - name: Cleanup ephemeral environment
        if: always()
        run: |
          echo "Cleaning up ephemeral environment..."
          # Example: docker-compose down
          # Example: heroku destroy --app temporary-scan-app-${GITHUB_SHA} --confirm temporary-scan-app-${GITHUB_SHA}