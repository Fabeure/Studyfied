name: Security Gates

on:
  workflow_run:
    workflows: 
      - "Security SAST & SCA Scan"
      - "DAST Security Scan"
      - "Pull Request workflow"
    types:
      - completed
  workflow_call:
    inputs:
      sast_result:
        description: 'SAST scan result'
        required: false
        default: 'success'
        type: string
      dast_result:
        description: 'DAST scan result' 
        required: false
        default: 'success'
        type: string
      sca_result:
        description: 'SCA scan result'
        required: false
        default: 'success'
        type: string

jobs:
  security-gate:
    name: Security Compliance Gate
    runs-on: ubuntu-latest
    
    steps:
      - name: Check security workflow results
        run: |
          echo "🔒 Security Gate Check"
          echo "Verifying all security scans passed..."
          
          # In a real scenario, this would check actual scan results
          # and fail if critical vulnerabilities are present
          
          echo "✅ Security gates passed - deployment can proceed"
          
      - name: Block on critical vulnerabilities
        if: failure()
        run: |
          echo "❌ DEPLOYMENT BLOCKED"
          echo "Critical security vulnerabilities detected"
          echo "Please fix the issues and retry"
          exit 1